name: PR CI - SQLFluff Linting and dbt Testing

# No `paths:` filter on purpose: PR_CI is a required status check on main (branch
# protection), and a required check that never starts (a PR touching no SQL/dbt
# files) would block the merge forever.
# Also on every push to main (routine work is pushed straight there): it doesn't block the
# push, but the tests still run and the README badge shows main's real state.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# Keyless BigQuery auth: GitHub's OIDC token is exchanged through Workload Identity
# Federation (pool github-pool, provider restricted to this repository) for a
# short-lived token of the read-only ci-runner service account (BigQuery jobUser +
# dataViewer). The org policy forbids service-account keys, so there is no JSON key.
permissions:
  contents: read
  id-token: write

jobs:
  PR_CI:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      BQ_LOCATION: asia-southeast1
      NEWS_SALT: ${{ secrets.NEWS_SALT }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/capstone_dbt_project/.dbt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install CI dependencies
        run: uv sync --group pr_ci --no-dev

      # Pure-logic tests of the agent (question parsing, passage rescue, retrieval helpers):
      # no network, no credentials. Config in pyproject.toml [tool.pytest.ini_options].
      - name: Run unit tests
        run: uv run pytest

      # The tracked capstone_dbt_project/.dbt/profiles.yml already has a BigQuery `ci`
      # target (method: oauth = the ADC credentials the auth step just wrote).
      - name: Run dbt debug
        run: uv run dbt debug --project-dir capstone_dbt_project -t ci

      - name: Run dbt deps
        run: uv run dbt deps --project-dir capstone_dbt_project -t ci

      - name: Run SQLFluff lint
        run: |
          sed 's/target = dev/target = ci/' .sqlfluff > .sqlfluff.ci
          uv run sqlfluff lint models --config .sqlfluff.ci
        working-directory: capstone_dbt_project

      - name: Run dbt tests
        run: uv run dbt test --project-dir capstone_dbt_project -t ci
