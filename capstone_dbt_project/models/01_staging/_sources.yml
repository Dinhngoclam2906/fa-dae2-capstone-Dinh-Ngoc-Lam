version: 2

sources:
  - name: raw
    description: Raw ingested data from Guardian historical Parquet loads
    schema: sc_t26
    database: DB_T26
    tables:
      - name: raw_data
        description: Raw articles data table loaded from Parquet files
        columns:
          - name: id
            description: Surrogate primary key for the row
            tests:
              - unique
              - not_null
          - name: crawl_timestamp
            description: Timestamp when the article was crawled
            tests:
              - not_null
          - name: article_id
            description: Original unique identifier for the article
            tests:
              - unique
              - not_null
          - name: web_publication_date
            description: Publication date of the article on the web
          - name: web_title
            description: Title of the article
            tests:
              - not_null
          - name: body_text
            description: Full body text/content of the article
          - name: web_url
            description: Original URL of the article
            tests:
              - not_null
          - name: section_name
            description: Section or category of the article (e.g., 'World', 'Sports')
          - name: loaded_at
            description: Timestamp when the row was loaded into Snowflake
            tests:
              - not_null