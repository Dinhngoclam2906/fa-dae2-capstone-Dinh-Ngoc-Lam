version: 2

sources:
  - name: raw
    description: Raw ingested articles - Guardian (HF archive + Content API) and Vietnamese news (Tuổi Trẻ / Thanh Niên / VnEconomy)
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw') }}"
    tables:
      - name: raw_data
        description: Raw articles table, loaded via load_raw_to_bigquery.py (--source hf/api/vn)
        # Silent-success guard: the guardian-ingestion job exits 0 even when it lands
        # nothing (see the 2026-10-12 cursor bug). loaded_at is set on INSERT only, so
        # it advances only when genuinely new articles land. Guardian-only: the VN
        # sources are one-off backfills with no recurring crawl.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'guardian'"
        columns:
          - name: crawl_timestamp
            description: Timestamp when the article was crawled
            tests:
              - not_null
          - name: article_id
            description: Original unique identifier for the article
            tests:
              - unique
              - not_null
          - name: web_publication_date
            description: Publication date of the article on the web
          - name: web_title
            description: Title of the article
            tests:
              - not_null
          - name: body_text
            description: Full body text/content of the article
          - name: web_url
            description: Original URL of the article
            tests:
              - not_null
          - name: section_name
            description: Section or category of the article (e.g., 'World', 'Sports'; Vietnamese sections are source-language strings)
          - name: data_source
            description: >
              Data source classification:
              - 'batch': Historical data (Guardian HF archive, or VN articles older than
                7 days at crawl time)
              - 'realtime': Live/recent data (Guardian Content API, or VN articles crawled
                within 7 days of publication)
            tests:
              - not_null
              - accepted_values:
                  values: ['batch', 'realtime']
          - name: source_name
            description: "Origin site: 'guardian', 'tuoitre', 'thanhnien', or 'vneconomy'"
            tests:
              - not_null
              - accepted_values:
                  values: ['guardian', 'tuoitre', 'thanhnien', 'vneconomy']
          - name: language
            description: "Article language: 'en' or 'vi'"
            tests:
              - not_null
              - accepted_values:
                  values: ['en', 'vi']
          - name: loaded_at
            description: Timestamp when the row was loaded into BigQuery
            tests:
              - not_null

      # Per-site freshness for the Vietnamese sources (vn-ingestion Cloud Run Job).
      # Aliases of raw_data (same table via `identifier`), one per site so a single
      # broken parser cannot hide behind the other two sites' fresh rows. Freshness
      # only - columns and tests live on raw_data above.
      - name: raw_data_tuoitre
        identifier: raw_data
        description: raw_data rows for Tuổi Trẻ (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'tuoitre'"
      - name: raw_data_thanhnien
        identifier: raw_data
        description: raw_data rows for Thanh Niên (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'thanhnien'"
      - name: raw_data_vneconomy
        identifier: raw_data
        description: raw_data rows for VnEconomy (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'vneconomy'"
