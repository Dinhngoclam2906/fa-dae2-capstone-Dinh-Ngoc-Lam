version: 2
models:
  - name: stg_sf__guardian
    description: Cleaned and standardized Guardian articles data from raw Parquet ingestion
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - article_id
            - crawl_timestamp
          severity: warn
    columns:
      - name: article_id
        description: Original unique article identifier
        tests:
          - not_null:
              severity: warn
      - name: web_title
        description: Article title
        tests:
          - not_null:
              severity: warn
      - name: web_url
        description: Source URL
        tests:
          - not_null:
              severity: warn
      - name: crawl_timestamp
        description: Crawl timestamp
        tests:
          - not_null:
              severity: warn
      - name: loaded_at
        description: Load timestamp to BigQuery (UTC)
        tests:
          - not_null:
              severity: warn
      - name: crawl_ts_local
        description: crawl_timestamp as local wall-clock DATETIME (var local_timezone, Asia/Ho_Chi_Minh). Display only.
      - name: web_publication_date_local
        description: web_publication_date as local wall-clock DATETIME. Display only.
      - name: loaded_at_local
        description: loaded_at as local wall-clock DATETIME. Display only.
      - name: has_valid_title
        description: Flag for valid title (non-empty, reasonable length)
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} = true"  # FIXED: Column-specific, lowercase true
              severity: warn
      - name: has_valid_url
        description: Flag for valid URL (starts with http, non-empty)
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} = true"
              severity: warn
      - name: has_valid_content
        description: Flag for valid content (non-empty body >50 chars)
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} = true"
              severity: warn
      - name: has_valid_section
        description: Flag for valid section name (non-empty)
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} = true"
              severity: warn
      - name: processed_at
        description: dbt processing timestamp
        tests:
          - not_null:
              severity: warn
          # Only the months each incremental run rewrites; older partitions keep the
          # processed_at of the run that last touched them. Same predicate as macro
          # recent_publication_months (custom macros can't be called from YAML config).
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} > TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 24 HOUR)"
              config:
                where: >-
                  web_publication_date >= TIMESTAMP(DATE_TRUNC(DATE_SUB(CURRENT_DATE(),
                  INTERVAL {{ var('incremental_lookback_days', 40) }} DAY), MONTH))
              severity: warn