version: 2
models:
  - name: stg_sf__guardian
    description: Cleaned and standardized Guardian articles data from raw Parquet ingestion
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - article_id
            - crawl_timestamp
          severity: error
    columns:
      - name: article_id
        description: Original unique article identifier
        tests:
          - not_null:
              severity: warn
      - name: web_title
        description: Article title
        tests:
          - not_null
      - name: web_url
        description: Source URL
        tests:
          - not_null
      - name: crawl_timestamp
        description: Crawl timestamp
        tests:
          - not_null
      - name: loaded_at
        description: Load timestamp to Snowflake
        tests:
          - not_null
      - name: has_valid_title
        description: Flag for valid title (non-empty, reasonable length)
        tests:
          - dbt_utils.expression_is_true:
              where: has_valid_title
              severity: error
      - name: has_valid_url
        description: Flag for valid URL (starts with http, non-empty)
        tests:
          - dbt_utils.expression_is_true:
              where: has_valid_url
              severity: error
      - name: has_valid_content
        description: Flag for valid content (non-empty body >50 chars)
        tests:
          - dbt_utils.expression_is_true:
              where: has_valid_content
              severity: error
      - name: has_valid_section
        description: Flag for valid section name (non-empty)
        tests:
          - dbt_utils.expression_is_true:
              where: has_valid_section
              severity: error
      - name: processed_at
        description: dbt processing timestamp
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "{{ column_name }} > CURRENT_TIMESTAMP - INTERVAL '24 hours'"