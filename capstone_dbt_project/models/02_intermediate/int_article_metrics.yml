version: 2

models:
  - name: int_article_metrics
    description: Aggregated Guardian article metrics by section
    columns:
      - name: section_name
        description: Article section
        tests:
          - not_null
          - unique
      - name: article_count
        description: Number of articles in section
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                where: article_count > 0
      - name: processed_at
        description: Aggregation timestamp
        tests:
          - not_null