version: 2

models:
  - name: fct_articles
    description: "Granular fact table for article publication events"
    config:
      tags: ["marts", "facts"]
    columns:
      - name: article_id
        description: "Article identifier (FK to dim_articles)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_articles')
                field: article_id
      - name: source_name
        description: "Origin site: guardian, tuoitre, thanhnien, vneconomy, tuoitre_en, vneconomy_en, vietnamnet, vietnamnet_en, vnexpress, vnexpress_en"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['guardian', 'tuoitre', 'thanhnien', 'vneconomy', 'tuoitre_en', 'vneconomy_en', 'vietnamnet', 'vietnamnet_en', 'vnexpress', 'vnexpress_en']
      - name: language
        description: "Article language: en or vi"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'vi']
      - name: crawl_ts_local
        description: "crawl_timestamp as local wall-clock DATETIME (var local_timezone). Display only."
      - name: web_publication_date_local
        description: "web_publication_date as local wall-clock DATETIME. Display only."
      - name: loaded_at_local
        description: "loaded_at as local wall-clock DATETIME. Display only."
      - name: dbt_updated_at_local
        description: "dbt_updated_at as local wall-clock DATETIME. Display only."
      - name: article_event_hk
        description: "Surrogate unique key for article events (article_id + crawl_timestamp)"
        tests:
          - unique
          - not_null
      - name: date_id
        description: "Date identifier (FK to dim_date)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: section_key
        description: "Section identifier (FK to dim_sections)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sections')
                field: section_key
      - name: web_url
        description: "Source URL for the article (for uniqueness aggregation)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "LIKE 'http%'"
  - name: obt_articles
    description: "One Big Table for the agent: one row per article (current version), section group denormalised in. Replaces the frozen star schema (2026-10-18)."
    config:
      tags: ["marts"]
    columns:
      - name: article_id
        description: "Article identifier (source-prefixed for newer VN sources)"
        tests:
          - unique
          - not_null
      - name: web_title
        tests:
          - not_null
      - name: body_text
        tests:
          - not_null
      - name: web_url
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "LIKE 'http%'"
      - name: web_publication_date
        tests:
          - not_null
      - name: section_name
        description: "Section as published (NULL when the source page had none)"
      - name: section_group
        description: "One of 12 coarse groups (macro section_group_macro); an empty section maps to 'Other'"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sports', 'Opinion', 'National News', 'Global & UK', 'Economy & Business', 'Politics', 'Technology', 'Science & Environment', 'Culture & Arts', 'Lifestyle & Travel', 'Society & Education', 'Other']
      - name: source_name
        description: "Origin site: guardian, tuoitre, thanhnien, vneconomy, tuoitre_en, vneconomy_en, vietnamnet, vietnamnet_en, vnexpress, vnexpress_en"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['guardian', 'tuoitre', 'thanhnien', 'vneconomy', 'tuoitre_en', 'vneconomy_en', 'vietnamnet', 'vietnamnet_en', 'vnexpress', 'vnexpress_en']
      - name: language
        description: "Article language: en or vi"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'vi']
      - name: content_hash
        description: "MD5 of title|url|section|MD5(body); changes mean the article needs re-embedding"
        tests:
          - not_null
