version: 2

models:
  - name: fct_articles
    description: "Granular fact table for article publication events"
    config:
      tags: ["marts", "facts"]
    columns:
      - name: article_id
        description: "Article identifier (FK to dim_articles)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_articles')
                field: article_id
      - name: source_name
        description: "Origin site: guardian, tuoitre, thanhnien, vneconomy, tuoitre_en, vneconomy_en, vietnamnet, vietnamnet_en"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['guardian', 'tuoitre', 'thanhnien', 'vneconomy', 'tuoitre_en', 'vneconomy_en', 'vietnamnet', 'vietnamnet_en']
      - name: language
        description: "Article language: en or vi"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'vi']
      - name: crawl_ts_local
        description: "crawl_timestamp as local wall-clock DATETIME (var local_timezone). Display only."
      - name: web_publication_date_local
        description: "web_publication_date as local wall-clock DATETIME. Display only."
      - name: loaded_at_local
        description: "loaded_at as local wall-clock DATETIME. Display only."
      - name: dbt_updated_at_local
        description: "dbt_updated_at as local wall-clock DATETIME. Display only."
      - name: article_event_hk
        description: "Surrogate unique key for article events (article_id + crawl_timestamp)"
        tests:
          - unique
          - not_null
      - name: date_id
        description: "Date identifier (FK to dim_date)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: section_key
        description: "Section identifier (FK to dim_sections)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sections')
                field: section_key
      - name: web_url
        description: "Source URL for the article (for uniqueness aggregation)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "LIKE 'http%'"