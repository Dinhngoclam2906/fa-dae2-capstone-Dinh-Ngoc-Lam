capstone_dbt_project:
  target: dev  # Default for local
  outputs:
    dev:
      type: bigquery
      method: oauth  # Application Default Credentials - no service-account key (org
                     # policy blocks key creation; see docs/phase0_baseline.md §7)
      project: "{{ env_var('GCP_PROJECT', 'project-f5433681-7b47-481f-9c7') }}"
      # Fallback only - every model in models/ sets its own +schema (staging/marts/
      # monitoring); a future model that forgets to would land here (7-day TTL) rather
      # than silently polluting a permanent dataset.
      dataset: "{{ env_var('BQ_DATASET_DEFAULT', 'scratch') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 4
      priority: interactive
      maximum_bytes_billed: 10000000000  # 10 GB hard stop per query

    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET_DEFAULT', 'scratch') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 1
      priority: interactive
      maximum_bytes_billed: 10000000000
