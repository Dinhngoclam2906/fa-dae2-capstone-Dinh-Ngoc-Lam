# news-pipeline (Cloud Workflows): the Cloud Run Jobs chained like an Airflow DAG.
#
#   guardian-ingestion -> vn-ingestion [-> dbt-build -> embed-sync]
#
# Each step starts a job and waits for its execution to finish before the next one.
# Argument {"transform": true} adds dbt-build + embed-sync (the scheduled runs pass it);
# without it only ingestion runs. Deployed and scheduled by orchestration/workflows/deploy.sh.
#
# Failure rules:
#   - an ingestion failure doesn't block the next step: sources are independent and the
#     dbt-build freshness check flags a stale one;
#   - a dbt-build failure skips embed-sync (Airflow's upstream_failed);
#   - the execution ends FAILED if any step failed (the job itself also alerts).

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - transform: false
          - failed: []
          # timeout = task timeout + headroom for queueing / cold start
          - ingestion_jobs:
              - {name: "guardian-ingestion", timeout: 1800}
              - {name: "vn-ingestion", timeout: 4500}
    - read_args:
        switch:
          - condition: ${args != null and "transform" in args}
            assign:
              - transform: ${args.transform}
    - ingest:
        for:
          value: job
          in: ${ingestion_jobs}
          steps:
            - run_ingestion:
                call: run_job
                args:
                  project: ${project}
                  region: ${region}
                  job: ${job.name}
                  timeout: ${job.timeout}
                result: ok
            - note_ingestion:
                switch:
                  - condition: ${not ok}
                    assign:
                      - failed: ${list.concat(failed, job.name)}
    - transform_or_finish:
        switch:
          - condition: ${not transform}
            next: finish
    - dbt_build:
        call: run_job
        args:
          project: ${project}
          region: ${region}
          job: "dbt-build"
          timeout: 2700
        result: dbt_ok
    - dbt_gate:
        switch:
          - condition: ${not dbt_ok}
            assign:
              - failed: ${list.concat(failed, "dbt-build (embed-sync skipped)")}
            next: finish
    - embed_sync:
        call: run_job
        args:
          project: ${project}
          region: ${region}
          job: "embed-sync"
          timeout: 12600
        result: embed_ok
    - note_embed:
        switch:
          - condition: ${not embed_ok}
            assign:
              - failed: ${list.concat(failed, "embed-sync")}
    - finish:
        switch:
          - condition: ${len(failed) > 0}
            raise: ${"pipeline failed at " + json.encode_to_string(failed)}
    - done:
        return:
          transform: ${transform}
          failed: ${failed}

# Runs one Cloud Run Job and waits for the execution. Returns true on success, false on
# failure or timeout (logged), so the caller decides what is downstream of it.
run_job:
  params: [project, region, job, timeout]
  steps:
    - log_start:
        call: sys.log
        args:
          text: ${"start " + job}
          severity: INFO
    - run:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
            connector_params:
              timeout: ${timeout}
          result: operation
        except:
          as: e
          steps:
            - log_failure:
                call: sys.log
                args:
                  text: ${job + " FAILED " + json.encode_to_string(e)}
                  severity: ERROR
            - return_failure:
                return: false
    - log_success:
        call: sys.log
        args:
          text: ${job + " succeeded " + default(map.get(operation, "name"), "")}
          severity: INFO
    - return_success:
        return: true
