[project]
name = "fa-dae2-capstone-dinh-ngoc-lam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.1",
    "choco>=1.0.5",
    "confluent-kafka>=2.13.0",
    "dbt-core>=1.10.13",
    "dbt-snowflake>=1.10.2",
    "docx>=0.2.4",
    "en-core-web-sm",
    "faker>=37.6.0",
    "flashrank>=0.2.10",
    "git-filter-repo>=2.47.0",
    "huggingface-hub[hf-xet]>=0.35.3",
    "ijson>=3.4.0",
    "joblib>=1.5.2",
    "kafka-python>=2.2.15",
    "kaggle>=1.7.4.5",
    "keybert>=0.9.0",
    "langchain>=1.1.0",
    "langchain-experimental>=0.4.1",
    "langchain-litellm>=0.3.2",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "langgraph-checkpoint-postgres>=3.0.1",
    "logger>=1.4",
    "nltk>=3.9.1",
    "openai>=2.8.1",
    "orjson>=3.11.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.8",
    "pillow>=11.3.0",
    "polars>=1.33.1",
    "psutil>=7.1.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]~=3.2",
    "pyarrow>=21.0.0",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "python-json-logger>=4.0.0",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "sentence-transformers>=5.2.0",
    "snowflake-connector-python>=3.17.4",
    "spacy>=3.8.11",
    "sqlalchemy>=2.0.43",
    "streamlit>=1.51.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "textblob>=0.19.0",
    "tqdm>=4.67.1",
    "tree>=0.2.4",
]

[dependency-groups]
dev = [
    "dbt-snowflake>=1.10.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.2",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]
pr-ci = [
    "dbt-snowflake>=1.10.0",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]
airflow = [
    "dbt-core>=1.8.0",
    "dbt-snowflake>=1.8.0",
    "dbt-postgres>=1.8.0",
    "snowflake-connector-python[pandas,secure-local-storage]>=3.17.0",
    "psycopg[binary]>=3.2",
    "kafka-python>=2.0.2",           # remove if you don’t produce/consume from DAGs
]

[tool.uv.workspace]
members = [
    "capstone_dbt_project",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }

[tool.pyright]
extraPaths = [
    "./scripts/data_collection",
    "./scripts/ingestion"
]
