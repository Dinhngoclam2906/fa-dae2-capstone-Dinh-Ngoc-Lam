[project]
name = "fa-dae2-capstone-dinh-ngoc-lam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.1",
    "choco>=1.0.5",
    "dbt-core>=1.10.13",
    "dbt-snowflake>=1.10.2",
    "faker>=37.6.0",
    "git-filter-repo>=2.47.0",
    "huggingface-hub[hf-xet]>=0.35.3",
    "ijson>=3.4.0",
    "joblib>=1.5.2",
    "kaggle>=1.7.4.5",
    "logger>=1.4",
    "matplotlib>=3.10.6",
    "nltk>=3.9.1",
    "orjson>=3.11.3",
    "polars>=1.33.1",
    "psutil>=7.1.0",
    "psycopg[binary]~=3.2",
    "pyarrow>=21.0.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "seaborn>=0.13.2",
    "snowflake-connector-python>=3.17.4",
    "sqlalchemy>=2.0.43",
    "tenacity>=9.1.2",
    "textblob>=0.19.0",
    "tqdm>=4.67.1",
    "tree>=0.2.4",
    "vadersentiment>=3.3.2",
    "wordcloud>=1.9.4",
]

[dependency-groups]
dev = [
    "dbt-snowflake>=1.10.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.2",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]
pr-ci = [
    "dbt-snowflake>=1.10.0",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]

[tool.uv.workspace]
members = [
    "capstone_dbt_project",
]

[tool.pyright]
extraPaths = [
    "./scripts/data_collection",
    "./scripts/ingestion"
]
