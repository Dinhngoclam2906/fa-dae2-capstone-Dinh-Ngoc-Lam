version: 2

sources:
  - name: raw
    description: Raw ingested articles - Guardian (HF archive + Content API) and Vietnamese news (Tuổi Trẻ / Thanh Niên / VnEconomy)
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw') }}"
    tables:
      - name: raw_data
        description: Raw articles table, loaded via load_raw_to_bigquery.py (--source hf/api/vn)
        # Silent-success guard: the guardian-ingestion job exits 0 even when it lands
        # nothing (see the 2026-10-12 cursor bug). loaded_at is set on INSERT only, so
        # it advances only when genuinely new articles land. Guardian-only: the VN
        # sources are one-off backfills with no recurring crawl.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'guardian'"
        columns:
          - name: crawl_timestamp
            description: Timestamp when the article was crawled
            tests:
              - not_null
          - name: article_id
            description: Original unique identifier for the article
            tests:
              - unique
              - not_null
          - name: web_publication_date
            description: Publication date of the article on the web
          - name: web_title
            description: Title of the article
            tests:
              - not_null
          - name: body_text
            description: Full body text/content of the article
          - name: web_url
            description: Original URL of the article
            tests:
              - not_null
          - name: section_name
            description: Section or category of the article (e.g., 'World', 'Sports'; Vietnamese sections are source-language strings)
          - name: data_source
            description: >
              Data source classification:
              - 'batch': Historical data (Guardian HF archive, or VN articles older than
                7 days at crawl time)
              - 'realtime': Live/recent data (Guardian Content API, or VN articles crawled
                within 7 days of publication)
            tests:
              - not_null
              - accepted_values:
                  values: ['batch', 'realtime']
          - name: source_name
            description: "Origin site: 'guardian', 'tuoitre', 'thanhnien', 'vneconomy', 'vietnamnet', or the English editions 'tuoitre_en' (news.tuoitre.vn) / 'vneconomy_en' (en.vneconomy.vn) / 'vietnamnet_en' (vietnamnet.vn/en), plus 'vnexpress' / 'vnexpress_en' (RSS-only), and since 2026-10-24 'dantri_en' (DTiNews) / 'vir' (Vietnam Investment Review), since 2026-10-27 'vietnamfinance', since 2026-10-28 'congthuong' (Công Thương) / 'ven' (its English edition, Vietnam Economic News), since 2026-10-29 'baodautu' (Báo Đầu tư)"
            tests:
              - not_null
              - accepted_values:
                  values: ['guardian', 'tuoitre', 'thanhnien', 'vneconomy', 'tuoitre_en', 'vneconomy_en', 'vietnamnet', 'vietnamnet_en', 'vnexpress', 'vnexpress_en', 'dantri_en', 'vir', 'vietnamfinance', 'congthuong', 'ven', 'baodautu']
          - name: language
            description: "Article language: 'en' or 'vi'"
            tests:
              - not_null
              - accepted_values:
                  values: ['en', 'vi']
          - name: loaded_at
            description: Timestamp when the row was loaded into BigQuery
            tests:
              - not_null

      # Per-site freshness for the Vietnamese sources (vn-ingestion Cloud Run Job).
      # Aliases of raw_data (same table via `identifier`), one per site so a single
      # broken parser cannot hide behind the other two sites' fresh rows. Freshness
      # only - columns and tests live on raw_data above.
      - name: raw_data_tuoitre
        identifier: raw_data
        description: raw_data rows for Tuổi Trẻ (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'tuoitre'"
      - name: raw_data_thanhnien
        identifier: raw_data
        description: raw_data rows for Thanh Niên (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'thanhnien'"
      - name: raw_data_vneconomy
        identifier: raw_data
        description: raw_data rows for VnEconomy (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'vneconomy'"
      # English editions publish ~12-15 articles/day (fewer at weekends), so a looser
      # window than the Vietnamese sites avoids false alarms on a quiet Sunday.
      - name: raw_data_tuoitre_en
        identifier: raw_data
        description: raw_data rows for Tuoi Tre News, English edition (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'tuoitre_en'"
      - name: raw_data_vneconomy_en
        identifier: raw_data
        description: raw_data rows for VnEconomy, English edition (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'vneconomy_en'"
      - name: raw_data_vietnamnet
        identifier: raw_data
        description: raw_data rows for VietNamNet (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'vietnamnet'"
      - name: raw_data_vietnamnet_en
        identifier: raw_data
        description: raw_data rows for VietNamNet Global, English edition (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'vietnamnet_en'"
      - name: raw_data_vnexpress
        identifier: raw_data
        description: raw_data rows for VnExpress (RSS-only; freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
            filter: "source_name = 'vnexpress'"
      - name: raw_data_vnexpress_en
        identifier: raw_data
        description: raw_data rows for VnExpress International, English (RSS-only; freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'vnexpress_en'"
      - name: raw_data_dantri_en
        identifier: raw_data
        description: raw_data rows for DTiNews, Dân Trí's English edition (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'dantri_en'"
      - name: raw_data_vir
        identifier: raw_data
        description: raw_data rows for Vietnam Investment Review, English (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'vir'"
      - name: raw_data_vietnamfinance
        identifier: raw_data
        description: raw_data rows for VietnamFinance (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'vietnamfinance'"
      - name: raw_data_congthuong
        identifier: raw_data
        description: raw_data rows for Công Thương (freshness only)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'congthuong'"
      - name: raw_data_ven
        identifier: raw_data
        description: raw_data rows for VEN, Công Thương's English edition (freshness only; ~5/day)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 96, period: hour}
            filter: "source_name = 'ven'"
      - name: raw_data_baodautu
        identifier: raw_data
        description: raw_data rows for Báo Đầu tư (freshness only; listing pages, ~90/day)
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
            filter: "source_name = 'baodautu'"
